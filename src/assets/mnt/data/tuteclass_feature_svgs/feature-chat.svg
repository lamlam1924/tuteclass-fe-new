<svg width="360" height="240" viewBox="0 0 360 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bubble1{animation:rise 4s ease-in-out infinite}.bubble2{animation:rise 4.4s ease-in-out infinite .4s}.bubble3{animation:rise 4.8s ease-in-out infinite .8s}.dot{animation:typing 1.4s ease-in-out infinite}@keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes typing{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
  </style>
  <rect width="360" height="240" rx="34" fill="#FFF7EC"/>
  <g class="bubble1"><rect x="42" y="48" width="220" height="48" rx="16" fill="white" stroke="#F0D6B8"/><text x="62" y="78" font-size="15" font-weight="700" fill="#0B2F66" font-family="Arial">Em chưa hiểu bài này ạ 😢</text></g>
  <g class="bubble2"><rect x="104" y="113" width="214" height="52" rx="16" fill="#FFF0E2" stroke="#FFC69D"/><text x="124" y="144" font-size="15" font-weight="700" fill="#0B2F66" font-family="Arial">Thầy giải thích giúp em với ạ</text></g>
  <g class="bubble3"><rect x="54" y="178" width="144" height="38" rx="15" fill="white" stroke="#F0D6B8"/><circle class="dot" cx="86" cy="197" r="5" fill="#9AA7B8"/><circle class="dot" cx="113" cy="197" r="5" fill="#9AA7B8" style="animation-delay:.2s"/><circle class="dot" cx="140" cy="197" r="5" fill="#9AA7B8" style="animation-delay:.4s"/></g>
  <g><circle cx="286" cy="176" r="18" fill="#FF5C00"/><text x="281" y="183" font-size="18" font-weight="900" fill="white" font-family="Arial">3</text></g>
  <path d="M283 58c32 37 35 82 2 124" stroke="#FF8A3D" stroke-width="2" stroke-dasharray="7 8" opacity=".65"/>
</svg>
