<svg width="360" height="240" viewBox="0 0 360 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .orbit{transform-origin:180px 118px;animation:spin 16s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}.avatar{animation:float 4s ease-in-out infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.06);opacity:1}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  </style>
  <rect width="360" height="240" rx="34" fill="#F4F8FF"/>
  <circle cx="180" cy="118" r="82" stroke="#2F7CFF" stroke-width="2" stroke-dasharray="7 10" opacity=".35"/>
  <g class="orbit"><circle cx="180" cy="36" r="5" fill="#2F7CFF"/><circle cx="262" cy="118" r="5" fill="#20A66A"/><circle cx="98" cy="118" r="5" fill="#FF5C00"/></g>
  <g class="pulse">
    <circle cx="180" cy="118" r="44" fill="#2F7CFF" opacity=".16"/>
    <circle cx="180" cy="118" r="31" fill="#2F7CFF"/>
    <path d="M168 124c2-7 22-7 24 0v6h-24v-6Z" fill="white"/><circle cx="174" cy="111" r="6" fill="white"/><circle cx="186" cy="111" r="6" fill="white"/>
  </g>
  <g class="avatar"><circle cx="115" cy="72" r="20" fill="white" stroke="#C9DCFF"/><circle cx="115" cy="66" r="7" fill="#0B2F66"/><path d="M103 84c3-12 21-12 24 0" fill="#FFB37B"/></g>
  <g class="avatar" style="animation-delay:.5s"><circle cx="244" cy="76" r="20" fill="white" stroke="#C9DCFF"/><circle cx="244" cy="70" r="7" fill="#0B2F66"/><path d="M232 88c3-12 21-12 24 0" fill="#FFB37B"/></g>
  <g class="avatar" style="animation-delay:1s"><circle cx="234" cy="171" r="20" fill="white" stroke="#C9DCFF"/><circle cx="234" cy="165" r="7" fill="#0B2F66"/><path d="M222 183c3-12 21-12 24 0" fill="#FFB37B"/></g>
  <g class="avatar" style="animation-delay:1.5s"><circle cx="118" cy="167" r="20" fill="white" stroke="#C9DCFF"/><circle cx="118" cy="161" r="7" fill="#0B2F66"/><path d="M106 179c3-12 21-12 24 0" fill="#FFB37B"/></g>
</svg>
